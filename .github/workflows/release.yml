name: Release

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  select-mode:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.select-mode.outputs.mode }}
      publish-plan-artifact-id: ${{ steps.select-mode.outputs.publish-plan-artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0

      - id: select-mode
        uses: changesets/action/select-mode@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2

  version:
    needs: select-mode
    if: needs.select-mode.outputs.mode == 'version'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0

      - uses: changesets/action/version@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          script: pnpm version-packages

  pack:
    needs: select-mode
    if: needs.select-mode.outputs.mode == 'publish'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      pack-dir-artifact-id: ${{ steps.pack.outputs.pack-dir-artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0

      - run: vp run ready

      - id: pack
        uses: changesets/action/pack@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          publish-plan-artifact-id: ${{ needs.select-mode.outputs.publish-plan-artifact-id }}

  stage:
    needs: pack
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    outputs:
      staged-packages: ${{ steps.stage.outputs.staged-packages }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.pack.outputs.pack-dir-artifact-id }}
          path: ${{ runner.temp }}/pack
          merge-multiple: true

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - id: stage
        working-directory: ${{ runner.temp }}/pack
        run: |
          set -euo pipefail
          staged='[]'
          failed=0
          while read -r release; do
            name=$(jq -r .name <<< "$release")
            version=$(jq -r .version <<< "$release")
            status=0
            npx --yes npm@12.2.3 stage publish "./$(jq -r .tarball.path <<< "$release")" \
              --tag "$(jq -r .tag <<< "$release")" --access "$(jq -r .access <<< "$release")" --provenance \
              > "$RUNNER_TEMP/stage.log" 2>&1 || status=$?
            cat "$RUNNER_TEMP/stage.log"
            if [[ "$status" == 0 ]]; then
              staged=$(jq -c --arg name "$name" --arg version "$version" '. + [{ name: $name, version: $version }]' <<< "$staged")
            elif grep -q 'previously staged' "$RUNNER_TEMP/stage.log"; then
              echo "$name@$version is already staged and waits for approval."
            else
              failed=1
            fi
          done < <(jq -c '.plan[][] | select(.kind == "publish")' publish-plan.json)
          echo "staged-packages=$staged" >> "$GITHUB_OUTPUT"
          exit "$failed"

  github-release:
    needs: stage
    if: ${{ !cancelled() && needs.stage.outputs.staged-packages != '' && needs.stage.outputs.staged-packages != '[]' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          STAGED_PACKAGES: ${{ needs.stage.outputs.staged-packages }}
        run: |
          set -euo pipefail
          jq -c '.[]' <<< "$STAGED_PACKAGES" | while read -r package; do
            name=$(jq -r .name <<< "$package")
            version=$(jq -r .version <<< "$package")
            tag="$name@$version"
            awk -v heading="## $version" '$0 == heading { found = 1; next } found && /^## / { exit } found' \
              "packages/${name#@formtree/}/CHANGELOG.md" > "$RUNNER_TEMP/notes.md"
            if [[ "$version" == *-* ]]; then prerelease=true; else prerelease=false; fi
            gh release create "$tag" --draft --target "$GITHUB_SHA" --title "$tag" --notes-file "$RUNNER_TEMP/notes.md" \
              --prerelease="$prerelease"
          done
