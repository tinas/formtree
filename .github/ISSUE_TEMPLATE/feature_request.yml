name: Feature request
description: A new capability or a change to how formtree works.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: The form you are building, what is hard to do today and how you work around it.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How you would like it to work. An API sketch helps but is not required. If you'd like to build it yourself, mention it here.
